<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Forbidden Dark Zone</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-red: #ff003c;
            --dark-bg: #050505;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--dark-bg);
            color: var(--neon-red);
            font-family: 'Rajdhani', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            perspective: 1000px;
            padding: 20px; /* Mobile safety padding */
        }

        /* 🌌 BACKGROUND MATRIX EFFECT */
        .stars {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, rgba(255, 0, 60, 0.05) 0%, transparent 70%);
            z-index: -1;
        }

        .container {
            text-align: center;
            padding: 30px;
            border: 1px solid rgba(255, 0, 60, 0.2);
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            box-shadow: 0 0 50px rgba(255, 0, 60, 0.1);
            width: 100%;
            max-width: 600px;
            border-radius: 15px;
            transition: transform 0.1s ease-out; /* Smooth parallax */
        }

        /* ⚡ RESPONSIVE GLITCH EFFECT */
        .glitch {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(80px, 20vw, 150px); /* Adaptive sizing */
            font-weight: bold;
            position: relative;
            text-shadow: 0.05em 0 0 rgba(255, 0, 60, 0.75),
                         -0.025em -0.05em 0 rgba(0, 255, 255, 0.75),
                         0.025em 0.05em 0 rgba(255, 255, 0, 0.75);
            animation: glitch 500ms infinite;
            line-height: 1;
            margin-bottom: 10px;
        }

        @keyframes glitch {
            0% { text-shadow: 0.05em 0 0 rgba(255,0,60,.75), -0.05em -0.025em 0 rgba(0,255,255,.75); }
            14% { text-shadow: 0.05em 0 0 rgba(255,0,60,.75), -0.05em -0.025em 0 rgba(0,255,255,.75); }
            15% { text-shadow: -0.05em -0.025em 0 rgba(255,0,60,.75), 0.025em 0.025em 0 rgba(0,255,255,.75); }
            49% { text-shadow: -0.05em -0.025em 0 rgba(255,0,60,.75), 0.025em 0.025em 0 rgba(0,255,255,.75); }
            50% { text-shadow: 0.025em 0.05em 0 rgba(255,0,60,.75), 0.05em 0 0 rgba(0,255,255,.75); }
            99% { text-shadow: 0.025em 0.05em 0 rgba(255,0,60,.75), 0.05em 0 0 rgba(0,255,255,.75); }
            100% { text-shadow: -0.025em 0 0 rgba(255,0,60,.75), -0.025em -0.025em 0 rgba(0,255,255,.75); }
        }

        .msg {
            font-size: clamp(16px, 4vw, 24px);
            letter-spacing: clamp(2px, 1vw, 5px);
            margin-bottom: 20px;
            text-transform: uppercase;
            font-weight: bold;
        }

        p {
            color: #888;
            margin-bottom: 30px;
            font-size: clamp(14px, 3.5vw, 18px);
            line-height: 1.5;
        }

        /* 🚀 RETURN BUTTON */
        .btn {
            display: inline-block;
            padding: 12px 30px;
            border: 2px solid var(--neon-red);
            color: var(--neon-red);
            text-decoration: none;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            transition: 0.4s;
            position: relative;
            overflow: hidden;
            font-size: 14px;
            text-transform: uppercase;
        }

        .btn:hover, .btn:active {
            background: var(--neon-red);
            color: #000;
            box-shadow: 0 0 30px var(--neon-red);
        }

        /* 📺 CRT SCANLINE EFFECT */
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
        }

        /* Mobile specific adjustments */
        @media (max-width: 480px) {
            .container { padding: 20px; border-radius: 10px; }
            .msg { margin-bottom: 10px; }
        }
    </style>
</head>
<body>
    <div class="stars"></div>
    <div class="scanlines"></div>
    
    <div class="container" id="error-box">
        <div class="glitch" data-text="404">404</div>
        <div class="msg">>> COORDINATES CORRUPTED</div>
        <p>Cadet, you've breached the Forbidden Sector of the Dark Zone.<br>
        Oxygen levels dropping. Immediate extraction required.</p>
        <a href="/" class="btn">RETURN TO HOME BASE 🛰️</a>
    </div>

    <script>
        // Adaptive Parallax Logic
        const box = document.getElementById('error-box');
        
        // PC: Mouse Parallax
        if (window.innerWidth > 1024) {
            document.addEventListener('mousemove', (e) => {
                const x = (window.innerWidth / 2 - e.pageX) / 25;
                const y = (window.innerHeight / 2 - e.pageY) / 25;
                box.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
            });
        } 
        // Mobile: Tilt Logic (Optional - isse UX smooth rehta hai)
        else {
            window.addEventListener('deviceorientation', (e) => {
                const x = e.gamma / 4; // Tilt left-right
                const y = e.beta / 4;  // Tilt front-back
                box.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
            });
        }
    </script>
</body>
</html>
